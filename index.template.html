<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>RouVel Compiler</title>
</head>

<body>
    <h3>Salida del Programa</h3>
    <script>
        // Memoria compartida con el módulo WASM.
        var memory = new WebAssembly.Memory({ initial: 1 });

        // Funciones de log.
        function log_i32(x) { console.log("[i32]", x); }
        function log_f32(x) { console.log("[f32]", x); }
        function log_f64(x) { console.log("[f64]", x); }
        function log_i64(x) { console.log("[i64]", typeof x === "bigint" ? x + "n" : x); }

        function log_string(ptr, len) {
            const bytes = new Uint8Array(memory.buffer, ptr, len);
            const str = new TextDecoder("utf8").decode(bytes);
            console.log("[str]", str);
        }

        // Import object con las funciones disponibles en el WASM.
        var importObject = {
            console: {
                log_i32,
                log_f32,
                log_string
            },
            js: { mem: memory }
        };

        // Carga dinámica del .wasm
        fetch("wat.wasm")
            .then(r => WebAssembly.instantiateStreaming(r, imports))
            .then(obj => {
                if (obj.instance.exports.main)
                    obj.instance.exports.main();
            })
            .catch(err => console.error(err));
    </script>
</body>

</html>
